name: Font availability

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: availability
        continue-on-error: true
        run: npm run verify:downloads
        env:
          FONT_SITE_URL: https://fonts.blissbiovn.com
          FONT_VERIFY_CONCURRENCY: 6
          FONT_VERIFY_TIMEOUT_MS: 45000
          FONT_VERIFY_RETRIES: 3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-availability-report
          path: manifests/download-verification*.json
          retention-days: 30
      - if: steps.availability.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Font availability check needs review";
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            const issue = open.data.find(item => item.title === title);
            const body = `The scheduled font check found one or more unavailable downloads.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (issue) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - if: steps.availability.outcome == 'failure'
        run: exit 1
